<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="./static/favicon.png" />
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="description"
        content="An alternative approach to adjust something very accurate in electronic circuits by assembling fix value resistors instead of using trimmers or potentiometers.">
    <meta name="keywords"
        content="IterativeTrimming Iterative Trimmer Potentiometer fix value accuracy resistor stability longterm adjusting amplifier low-noise precision error">
    <link rel="stylesheet" href="static/images/css/style.css">

    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <!-- for splashscreen -->
    <style>
        #loading { outline: none; border: none; background: transparent }
        #app_content { display: none; }
        #online_calculator { margin-bottom: 6px; }
        section.pyscript { margin-top: 0; width: 100%; }
        #figure_h_field_plot { margin-top: 0; }
        #figure_h_field_plot figure { margin: 0; }
        #figure_h_field_plot img { display: block; width: 100%; height: auto; }
    </style>
    <script type="module">
        const loading = document.getElementById('loading');
        const appContent = document.getElementById('app_content');
        addEventListener('py:ready', () => {
            loading.close();
            appContent.style.display = 'block';
        });
        loading.showModal();
    </script>

    <title>H-Field Calculator for Magnetic Loop Antenna</title>
</head>

<body>
        <dialog id="loading">
            <h1>Loading...</h1>
        </dialog>

    <div id="app_content">
    <div id="readme"></div>
    <script type="py" src="./index_readme.py" async></script>

    <div id="online_calculator">
        <h3>Online calculator</h3>
        <table>
            <tbody>
                <tr>
                    <td>
                        <label for="I_A">Current<br>(measured value of Potentiometer)</label>
                    </td>
                    <td>
                        <input type="text" id="I_A" maxlength="10" value="10">
                        <button type="submit" py-click="do_calculate">Calculate</button>
                    </td>
                </tr>
                <tr>
                    <td>Suggested fix value resistors</td>
                    <td>Target resistance: <b id="loesung_sollwert">...</b></td>
                </tr>
                <tr>
                    <td></td>
                    <td>h_field: <b id="h_field">...</b></td>
                </tr>


                <!-- <script type="py" src="./index.py" config="pyscript.toml"></script> -->

            </tbody>
        </table>
    </div>

    <section class="pyscript">
        <div id="figure_h_field_plot"></div>
        <script type="py" src="./index.py" config="./pyscript.toml"></script>
    </section>
    </div>

</body>

</html>
