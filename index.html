<body class="bg-slate-50 p-6 text-slate-900">
    <dialog id="loading">
        <h1>Loading...</h1>
    </dialog>

    <div id="app_content">
        <section id="page-card" aria-label="Pages">
            <div role="tablist" aria-label="Page selection">
                <button type="button" role="tab" aria-selected="false" aria-controls="page-s1p"
                    data-page-tab="s1p">
                    <span class="material-icons" aria-hidden="true">show_chart</span>
                    S1P Analyzer
                </button>
                <button type="button" role="tab" aria-selected="true" aria-controls="page-calculation"
                    data-page-tab="calculation">
                    <span class="material-icons" aria-hidden="true">podcasts</span>
                    Magnetic Loop Calculator
                </button>
                <button type="button" role="tab" aria-selected="false" aria-controls="page-compare"
                    data-page-tab="compare">
                    <span class="material-icons" aria-hidden="true">manage_search</span>
                    Magnetic Loop Antenna Comparison
                </button>
            </div>

            <div id="page_s1p" role="tabpanel" data-page-panel="s1p" hidden>-</div>
            <div id="page_calculator" role="tabpanel" data-page-panel="calculation">-</div>
            <div id="page_compare" role="tabpanel" data-page-panel="compare" hidden>-</div>
        </section>
    </div>


    <script>
        function printCheckedCheckboxes() {
            const checkedCheckboxes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                .map((checkbox) => checkbox.value);

            console.log(checkedCheckboxes);
        }

        document.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
            checkbox.addEventListener('change', printCheckedCheckboxes);
        });

        function normalizePageName(rawValue) {
            if (!rawValue) {
                return 'calculation';
            }
            const value = String(rawValue).toLowerCase();
            if (value === 'compare') {
                return 'compare';
            }
            if (value === 'calculator') {
                return 'calculation';
            }
            if (value === 'calculation') {
                return 'calculation';
            }
            if (value === 's1p') {
                return 's1p';
            }
            return 'calculation';
        }

        function showPage(pageName, updateUrl = true) {
            const normalized = normalizePageName(pageName);
            document.querySelectorAll('[data-page-tab]').forEach((tab) => {
                tab.setAttribute('aria-selected', String(tab.dataset.pageTab === normalized));
            });

            document.querySelectorAll('[data-page-panel]').forEach((panel) => {
                panel.hidden = panel.dataset.pagePanel !== normalized;
            });

            if (updateUrl) {
                const url = new URL(window.location.href);
                const pageParam = normalized === 'calculation' ? 'calculator'
                                : normalized === 'compare' ? 'compare'
                                : normalized;
                url.searchParams.set('page', pageParam);
                window.history.replaceState({}, '', url);
            }
        }

        document.querySelectorAll('[data-page-tab]').forEach((tab) => {
            tab.addEventListener('click', () => showPage(tab.dataset.pageTab));
        });

        const initialPageParam = new URLSearchParams(window.location.search).get('page');
        showPage(normalizePageName(initialPageParam), false);

        // Drag-and-drop support for the S1P drop zone (loaded dynamically by PyScript).
        // MutationObserver waits for the element to appear, then wires up drag events.
        (function () {
            function setupS1pDropZone() {
                const zone = document.getElementById('s1p_drop_zone');
                const input = document.getElementById('s1p_file_input');
                if (!zone || !input || zone._s1pReady) return;
                zone._s1pReady = true;
                obs.disconnect();

                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('border-blue-400', 'bg-blue-50');
                    zone.classList.remove('border-slate-400', 'bg-slate-100');
                });
                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('border-blue-400', 'bg-blue-50');
                    zone.classList.add('border-slate-400', 'bg-slate-100');
                });
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('border-blue-400', 'bg-blue-50');
                    zone.classList.add('border-slate-400', 'bg-slate-100');
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const dt = new DataTransfer();
                        dt.items.add(files[0]);
                        input.files = dt.files;
                        input.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });
            }

            const obs = new MutationObserver(setupS1pDropZone);
            obs.observe(document.body, { childList: true, subtree: true });
        })();
    </script>
