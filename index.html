<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="./static/favicon.png" />
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="description" content="Calculator for the magnetic field of a small magnetic loop antenna.">
    <meta name="keywords" content="Small magnetic loop antenna magnetic dipole moment calculator">
    <link rel="stylesheet" href="static/css/style_body.css">
    <link rel="stylesheet" href="static/css/style_body_tabs.css">
    <link rel="stylesheet" href="static/css/style_page_calculator.css">
    <link rel="stylesheet" href="static/css/style_page_compare_filter.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
    <!-- <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"> -->
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
    <!-- <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script> -->
    <!-- Enable MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <!-- Loading Message-Box: closed from resources/index.py once rendering is complete -->
    <script type="module">
        document.getElementById('loading').showModal();
    </script>

    <title>H-Field Calculator for Magnetic Loop Antenna</title>
</head>

<body class="bg-slate-50 p-6 text-slate-900">
    <dialog id="loading">
        <h1>Loading...</h1>
    </dialog>

    <div id="app_content">
        <section id="page-card" aria-label="Pages">
            <div role="tablist" aria-label="Page selection">
                <button type="button" role="tab" aria-selected="true" aria-controls="page-calculation"
                    data-page-tab="calculation">
                    <span class="material-icons" aria-hidden="true">podcasts</span>
                    Magnetic Loop Calculator
                </button>
                <button type="button" role="tab" aria-selected="false" aria-controls="page-compare"
                    data-page-tab="compare">
                    <span class="material-icons" aria-hidden="true">manage_search</span>
                    Magnetic Loop Antenna Comparison
                </button>
            </div>

            <div id="page_calculator" role="tabpanel" data-page-panel="calculation">-</div>
            <div id="page_compare" role="tabpanel" data-page-panel="compare" hidden>-</div>
        </section>
    </div>


    <script>
        function printCheckedCheckboxes() {
            const checkedCheckboxes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                .map((checkbox) => checkbox.value);

            console.log(checkedCheckboxes);
        }

        document.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
            checkbox.addEventListener('change', printCheckedCheckboxes);
        });

        function normalizePageName(rawValue) {
            if (!rawValue) {
                return 'calculation';
            }
            const value = String(rawValue).toLowerCase();
            if (value === 'compare') {
                return 'compare';
            }
            if (value === 'calculator') {
                return 'calculation';
            }
            if (value === 'calculation') {
                return 'calculation';
            }
            return 'calculation';
        }

        function showPage(pageName, updateUrl = true) {
            const normalized = normalizePageName(pageName);
            document.querySelectorAll('[data-page-tab]').forEach((tab) => {
                tab.setAttribute('aria-selected', String(tab.dataset.pageTab === normalized));
            });

            document.querySelectorAll('[data-page-panel]').forEach((panel) => {
                panel.hidden = panel.dataset.pagePanel !== normalized;
            });

            if (updateUrl) {
                const url = new URL(window.location.href);
                const pageParam = normalized === 'calculation' ? 'calculator' : 'compare';
                url.searchParams.set('page', pageParam);
                window.history.replaceState({}, '', url);
            }
        }

        document.querySelectorAll('[data-page-tab]').forEach((tab) => {
            tab.addEventListener('click', () => showPage(tab.dataset.pageTab));
        });

        const initialPageParam = new URLSearchParams(window.location.search).get('page');
        showPage(normalizePageName(initialPageParam), false);
    </script>

    <script type="py" src="./resources/lazyload.py" async></script>

    <section class="pyscript">
        <script type="py" src="./resources/index.py" config="./pyscript.toml"></script>
    </section>

</body>

</html>
