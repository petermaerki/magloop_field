<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="./static/favicon.png" />
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="description"
        content="An alternative approach to adjust something very accurate in electronic circuits by assembling fix value resistors instead of using trimmers or potentiometers.">
    <meta name="keywords"
        content="IterativeTrimming Iterative Trimmer Potentiometer fix value accuracy resistor stability longterm adjusting amplifier low-noise precision error">
    <link rel="stylesheet" href="static/images/css/style.css">

    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <!-- for splashscreen -->
    <style>
        #loading {
            outline: none;
            border: none;
            background: transparent
        }

        #app_content {
            display: none;
        }

        #online_calculator {
            margin-bottom: 6px;
        }

        section.pyscript {
            margin-top: 0;
            width: 100%;
        }

        #figure_h_field_plot {
            margin-top: 0;
        }

        #figure_h_field_plot figure {
            margin: 0;
        }

        #figure_h_field_plot img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
    <script type="module">
        const loading = document.getElementById('loading');
        const appContent = document.getElementById('app_content');
        addEventListener('py:ready', () => {
            loading.close();
            appContent.style.display = 'block';
        });
        loading.showModal();
    </script>

    <title>H-Field Calculator for Magnetic Loop Antenna</title>
</head>

<body>
    <dialog id="loading">
        <h1>Loading...</h1>
    </dialog>

    <div id="app_content">
        <div id="readme"></div>
        <script type="py" src="./index_readme.py" async></script>

        <div id="online_calculator">
            <h3>Online calculator</h3>
            <table>
                <tbody>
                    <tr>
                        <td class="input_label">
                            <label for="m_Am2">Magnetic dipole moment [A m^2]</label>
                        </td>
                        <td class="input_value">
                            <input type="text" id="m_Am2" value="7.85">
                        </td>
                    </tr>
                    <tr>
                        <td class="input_label">
                            <label for="f_MHz">Frequency [MHz]</label>
                        </td>
                        <td class="input_value">
                            <input type="text" id="f_MHz" value="14.1">
                        </td>
                    </tr>
                    <tr>
                        <td class="input_label">
                            <label for="x_m">X [m]</label>
                        </td>
                        <td class="input_value">
                            <input type="text" id="x_m" value="2.0">
                        </td>
                    </tr>
                    <tr>
                        <td class="input_label">
                            <label for="y_m">Y [m]</label>
                        </td>
                        <td class="input_value">
                            <input type="text" id="y_m" value="2.0">
                        </td>
                    </tr>
                    <tr>
                        <td class="input_label">
                            <label for="z_m">Z [m]</label>
                        </td>
                        <td class="input_value">
                            <input type="text" id="z_m" value="0.0">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>h_field @ point X/Y/Z: <b id="h_field">...</b></td>
                    </tr>
                    <tr>
                        <td class="input_label">
                            <label for="lim_x_m">Figure range X +-[m]</label>
                        </td>
                        <td class="input_value">
                            <input type="text" id="lim_x_m" value="4">
                        </td>
                    </tr>
                    <tr>
                        <td class="input_label">
                            <label for="lim_y_m">Figure range Y +-[m]</label>
                        </td>
                        <td class="input_value">
                            <input type="text" id="lim_y_m" value="3">
                        </td>
                    </tr>
                    <tr>
                        <td class="input_label">
                            <label for="line_at_field">Line @ field [A/m]</label>
                        </td>
                        <td class="input_value">
                            <input type="text" id="line_at_field" value="0.01, 0.05, 0.1, 0.2, 0.3">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <button type="submit" py-click="do_calculate">Calculate</button>
                        </td>
                    </tr>




                    <!-- <script type="py" src="./index.py" config="pyscript.toml"></script> -->

                </tbody>
            </table>
        </div>

        <section class="pyscript">
            <div id="figure_h_field_plot"></div>
            <script type="py" src="./index.py" config="./pyscript.toml"></script>
        </section>
    </div>

</body>

</html>
