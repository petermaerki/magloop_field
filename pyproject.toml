[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "magloop-field"
version = "0.1.0"
description = "Magnetic loop antenna calculations and field plotting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "maerki" }]
dependencies = [
    "scipy>=1.18.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

# [tool.setuptools]
# py-modules = ["calculations", "index", "index_readme", "magnetic_field_strength"]

[tool.pdm]
version = "0.0.1"
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = [
    "src/",
]
source-includes = [
    "README.md"
]
