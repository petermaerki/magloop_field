[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "magloop-field"
version = "0.1.0"
description = "Magnetic loop antenna calculations and field plotting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "maerki" }]
dependencies = [
    "scipy>=1.14.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy",
    "ruff",
    "ninja>=1.13",
]

# [tool.setuptools]
# py-modules = ["calculations", "index", "index_readme", "magnetic_field_strength"]

[tool.pdm]
version = "0.0.1"
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = [
    "src/",
]
excludes = [
    "**/*.svg",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.png",
    "**/*.md",
    "**/*.s1p",
    "**/*.html",
]
source-includes = [
    "README.md"
]


[tool.ruff]
target-version = "py313"
# All paths are relative to the project root, which is the directory containing the pyproject.toml.
src = ["src", "tests"]
exclude = [
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    # "I",  # isort
    "I001", # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # "W191",  # indentation contains tabs
    "D",     # enable docstring checks
    "B027",  #  empty method in an abstract base class
]

[tool.ruff.lint.per-file-ignores]
"pymeas2019_noise/__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
# known-third-party = ["usbhubctl"]
# known-local-folder = ["usbhubctl"]
case-sensitive = true
combine-as-imports = true
order-by-type = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.mypy]
# strict = true
# enable_incomplete_feature = ["NewGenericSyntax"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

