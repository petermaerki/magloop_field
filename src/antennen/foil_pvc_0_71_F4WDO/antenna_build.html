	<figcaption>“The coupling is achieved with a small coupling loop at the top. The coupling loop is made from 3 mm diameter stranded copper mains cable (outer diameter 5 mm). Exact dimensions are difficult to specify because it has an awkward shape, but it is roughly 22 x 10 cm.<br>
	Ideally, the coupling loop would be placed at the bottom, but in practice this is not easily possible. It is not known whether routing the coax through the loop diameter has any negative effects.<br>
	There are 26 #43 ferrite toroids over the feed to the coupling loop as a choke, covered with heat-shrink tubing.<br>
	The coupling method was considered to be more like a variable autotransformer than a gamma match, which normally uses a series capacitor as part of the matching arrangement. Making it remotely variable is a nice touch.”</figcaption>
</figure>
